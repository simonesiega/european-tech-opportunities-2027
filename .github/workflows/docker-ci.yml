name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Docker validation is expensive, so superseded runs on the same ref are canceled.
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Lint Dockerfile
        run: |
          docker run --rm --interactive \
            hadolint/hadolint:v2.15.1-debian@sha256:9a3944b7fddcb947d1ffd90829ac1a6e5c30479223358f249d8b96c7d0019e27 \
            < Dockerfile

      # Runtime containers use UID/GID 10001, so the host bind mount must match.
      - name: Prepare CI database bind mount
        run: |
          sudo install -d -m 2770 -o 10001 -g 10001 /srv/european-tech-opportunities-2027/data

      - name: Build production images
        run: docker compose build

      # Fail on actionable findings; unfixed distribution CVEs have no build-time remedy.
      - name: Scan images for fixable high and critical vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          cache_volume="trivy-cache-${GITHUB_RUN_ID}"
          trivy_image="aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969"
          trap 'docker volume rm --force "$cache_volume" >/dev/null 2>&1 || true' EXIT
          docker volume create "$cache_volume" >/dev/null

          # Registry authentication and manifest downloads can fail transiently. Retry only the
          # bounded pull without weakening the immutable digest, then prohibit implicit pulls during scans.
          for attempt in 1 2 3; do
            if docker pull "$trivy_image"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Could not pull the pinned Trivy image after $attempt attempts."
              exit 1
            fi
            sleep "$((attempt * 10))"
          done

          for image in \
            european-tech-opportunities-2027-cli:local \
            european-tech-opportunities-2027-site:local; do
            docker run --rm --pull=never \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "${cache_volume}:/root/.cache/trivy" \
              "$trivy_image" \
              image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done

      - name: Check CLI image
        run: docker compose run --rm opportunities --help

      - name: Check migration, site database access, public exports, and production headers
        run: |
          trap 'docker compose down --volumes' EXIT

          docker compose run --rm opportunities db-upgrade
          docker compose run --rm opportunities export-public

          # Synthetic versioned release: leave legacy exports distinct so a passing
          # download proves the website resolves `current`, not fixed paths.
          data_dir=/srv/european-tech-opportunities-2027/data
          sudo install -d -m 750 -o 10001 -g 10001 "$data_dir/releases/1-1/exports"
          sudo cp "$data_dir/opportunities.db" "$data_dir/releases/1-1/opportunities.db"
          sudo cp "$data_dir/exports/open-opportunities.csv" "$data_dir/releases/1-1/exports/"
          sudo cp "$data_dir/exports/open-opportunities.json" "$data_dir/releases/1-1/exports/"
          sudo chown -R 10001:10001 "$data_dir/releases"
          sudo chmod 550 "$data_dir/releases/1-1" "$data_dir/releases/1-1/exports"
          sudo chmod 440 "$data_dir/releases/1-1/opportunities.db" "$data_dir/releases/1-1/exports/"*
          sudo -u '#10001' ln -s releases/1-1 "$data_dir/current"
          printf 'legacy-only\n' | sudo tee "$data_dir/exports/open-opportunities.csv" >/dev/null
          # The image was built with Compose's localhost default; runtime metadata
          # routes must still advertise the production origin.
          if ! SITE_URL=https://opportunities2027.simonesiega.com OPPORTUNITIES_RELEASE_ROOT=/app/data docker compose up --detach site; then
            docker compose logs site opportunities
            exit 1
          fi

          for _ in $(seq 1 10); do
            if docker compose exec --no-TTY site node --input-type=module <<'NODE'
          const baseUrl = "http://127.0.0.1:3000";
          const canonicalOrigin = "https://opportunities2027.simonesiega.com";
          const [page, csv, json, robots, sitemap] = await Promise.all([
            fetch(baseUrl),
            fetch(`${baseUrl}/open-opportunities.csv`),
            fetch(`${baseUrl}/open-opportunities.json`),
            fetch(`${baseUrl}/robots.txt`),
            fetch(`${baseUrl}/sitemap.xml`),
          ]);
          const csp = page.headers.get("content-security-policy") ?? "";
          const hsts = page.headers.get("strict-transport-security") ?? "";
          const csvDisposition = csv.headers.get("content-disposition") ?? "";
          const jsonDisposition = json.headers.get("content-disposition") ?? "";
          const [pageHtml, csvText, jsonText, robotsText, sitemapText] = await Promise.all([
            page.text(),
            csv.text(),
            json.text(),
            robots.text(),
            sitemap.text(),
          ]);
          const valid =
            page.ok &&
            csv.ok &&
            json.ok &&
            robots.ok &&
            sitemap.ok &&
            csp.includes("default-src 'self'") &&
            csp.includes("script-src 'self' 'unsafe-inline' https://cloud.umami.is") &&
            csp.includes("connect-src 'self' https://gateway.umami.is") &&
            hsts.includes("max-age=63072000") &&
            csvDisposition.includes("open-opportunities.csv") &&
            jsonDisposition.includes("open-opportunities.json") &&
            pageHtml.includes(`rel="canonical" href="${canonicalOrigin}"`) &&
            csvText.startsWith(
              "linkedin_job_id,company,title,location,link,category,industries,employment_type,start_date"
            ) &&
            jsonText.trim() === "[]" &&
            robotsText.includes(`Sitemap: ${canonicalOrigin}/sitemap.xml`) &&
            sitemapText.includes(`<loc>${canonicalOrigin}/</loc>`);
          process.exit(valid ? 0 : 1);
          NODE
            then
              exit 0
            fi
            sleep 1
          done

          docker compose logs site opportunities
          exit 1
