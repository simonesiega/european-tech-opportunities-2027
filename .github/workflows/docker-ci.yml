name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Docker validation is expensive, so superseded runs on the same ref are canceled.
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SYFT_IMAGE: anchore/syft:v1.52.0@sha256:500e2d872ac019436926e8322b4fc1f39441d94d21f6f4046c6ff29b30e8cb02
      SYFT_VERSION: v1.52.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        run: |
          # actionlint v1.7.12 predates GitHub's self-repository syntax.
          # Ignore only that parser message; zizmor audits the actual references.
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -ignore 'specifying action "\$/.github/actions/.+" in invalid format because ref is missing' \
            -ignore 'reusable workflow call "\$/.github/workflows/.+" at "uses" is not following the format'

      - name: Audit workflows and composite actions with zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          version: v1.30.1
          inputs: |
            .github/workflows/
            .github/actions/

      - name: Lint Dockerfile
        run: |
          docker run --rm --interactive \
            hadolint/hadolint:v2.15.1-debian@sha256:9a3944b7fddcb947d1ffd90829ac1a6e5c30479223358f249d8b96c7d0019e27 \
            < Dockerfile

      # Runtime containers use UID/GID 10001, so the host bind mount must match.
      - name: Prepare CI database bind mount
        run: |
          sudo install -d -m 2770 -o 10001 -g 10001 /srv/european-tech-opportunities-2027/data

      - name: Build production images
        run: docker compose build

      - name: Prepare SBOM output directory
        run: mkdir -p build-artifacts

      - name: Pull digest-pinned Syft image
        run: docker pull "$SYFT_IMAGE"

      - name: Generate CLI production image SBOM
        shell: bash
        run: |
          docker run --rm --pull=never \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/build-artifacts:/out" \
            "$SYFT_IMAGE" \
            european-tech-opportunities-2027-cli:local \
            --output spdx-json=/out/opportunities-cli.spdx.json

      - name: Generate website production image SBOM
        shell: bash
        run: |
          docker run --rm --pull=never \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/build-artifacts:/out" \
            "$SYFT_IMAGE" \
            european-tech-opportunities-2027-site:local \
            --output spdx-json=/out/site.spdx.json

      - name: Record production image build provenance
        shell: bash
        run: |
          set -euo pipefail
          cli_reference=european-tech-opportunities-2027-cli:local
          site_reference=european-tech-opportunities-2027-site:local
          cli_image_id=$(docker image inspect --format '{{.Id}}' "$cli_reference")
          site_image_id=$(docker image inspect --format '{{.Id}}' "$site_reference")
          cli_repo_digests=$(docker image inspect --format '{{json .RepoDigests}}' "$cli_reference")
          site_repo_digests=$(docker image inspect --format '{{json .RepoDigests}}' "$site_reference")
          cli_platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$cli_reference")
          site_platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$site_reference")
          docker_engine_version=$(docker version --format '{{.Server.Version}}')
          docker_compose_version=$(docker compose version --short)
          buildx_version=$(docker buildx version)
          cli_sbom_sha256=$(sha256sum build-artifacts/opportunities-cli.spdx.json | cut -d' ' -f1)
          site_sbom_sha256=$(sha256sum build-artifacts/site.spdx.json | cut -d' ' -f1)

          jq -n \
            --arg repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg runner "$RUNNER_OS/$RUNNER_ARCH" \
            --arg docker_engine_version "$docker_engine_version" \
            --arg docker_compose_version "$docker_compose_version" \
            --arg buildx_version "$buildx_version" \
            --arg syft_version "$SYFT_VERSION" \
            --arg syft_image "$SYFT_IMAGE" \
            --arg cli_reference "$cli_reference" \
            --arg cli_image_id "$cli_image_id" \
            --argjson cli_repo_digests "$cli_repo_digests" \
            --arg cli_platform "$cli_platform" \
            --arg cli_sbom_sha256 "$cli_sbom_sha256" \
            --arg site_reference "$site_reference" \
            --arg site_image_id "$site_image_id" \
            --argjson site_repo_digests "$site_repo_digests" \
            --arg site_platform "$site_platform" \
            --arg site_sbom_sha256 "$site_sbom_sha256" \
            '{
              schemaVersion: "1.0",
              source: {repository: $repository, commit: $commit},
              workflow: {ref: $workflow_ref, runId: $run_id, runAttempt: $run_attempt, event: $event},
              builder: {
                runner: $runner,
                dockerEngine: $docker_engine_version,
                dockerCompose: $docker_compose_version,
                buildx: $buildx_version,
                sbomGenerator: {name: "Syft", version: $syft_version, image: $syft_image}
              },
              images: [
                {
                  target: "opportunities",
                  reference: $cli_reference,
                  imageId: $cli_image_id,
                  repositoryDigests: $cli_repo_digests,
                  platform: $cli_platform,
                  sbom: {file: "opportunities-cli.spdx.json", sha256: $cli_sbom_sha256}
                },
                {
                  target: "site",
                  reference: $site_reference,
                  imageId: $site_image_id,
                  repositoryDigests: $site_repo_digests,
                  platform: $site_platform,
                  sbom: {file: "site.spdx.json", sha256: $site_sbom_sha256}
                }
              ]
            }' > build-artifacts/build-provenance.json

          for sbom in build-artifacts/*.spdx.json; do
            jq -e '.spdxVersion == "SPDX-2.3" and (.packages | type == "array")' "$sbom" >/dev/null
          done
          (
            cd build-artifacts
            sha256sum opportunities-cli.spdx.json site.spdx.json build-provenance.json > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      # Fail on actionable findings; unfixed distribution CVEs have no build-time remedy.
      - name: Scan images for fixable high and critical vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          cache_volume="trivy-cache-${GITHUB_RUN_ID}"
          trivy_image="aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969"
          trap 'docker volume rm --force "$cache_volume" >/dev/null 2>&1 || true' EXIT
          docker volume create "$cache_volume" >/dev/null

          # Registry authentication and manifest downloads can fail transiently. Retry only the
          # bounded pull without weakening the immutable digest, then prohibit implicit pulls during scans.
          for attempt in 1 2 3; do
            if docker pull "$trivy_image"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Could not pull the pinned Trivy image after $attempt attempts."
              exit 1
            fi
            sleep "$((attempt * 10))"
          done

          for image in \
            european-tech-opportunities-2027-cli:local \
            european-tech-opportunities-2027-site:local; do
            docker run --rm --pull=never \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "${cache_volume}:/root/.cache/trivy" \
              "$trivy_image" \
              image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done

      - name: Check CLI image
        run: docker compose run --rm opportunities --help

      - name: Check migration, site database access, public exports, and production headers
        run: |
          trap 'docker compose down --volumes' EXIT

          docker compose run --rm opportunities db-upgrade
          docker compose run --rm opportunities export-public

          # Synthetic versioned release: leave legacy exports distinct so a passing
          # download proves the website resolves `current`, not fixed paths.
          data_dir=/srv/european-tech-opportunities-2027/data
          sudo install -d -m 750 -o 10001 -g 10001 "$data_dir/releases/1-1/exports"
          sudo cp "$data_dir/opportunities.db" "$data_dir/releases/1-1/opportunities.db"
          sudo cp "$data_dir/exports/open-opportunities.csv" "$data_dir/releases/1-1/exports/"
          sudo cp "$data_dir/exports/open-opportunities.json" "$data_dir/releases/1-1/exports/"
          sudo cp "$data_dir/exports/dataset-metadata.json" "$data_dir/releases/1-1/exports/"
          sudo chown -R 10001:10001 "$data_dir/releases"
          sudo chmod 550 "$data_dir/releases/1-1" "$data_dir/releases/1-1/exports"
          sudo chmod 440 "$data_dir/releases/1-1/opportunities.db" \
            "$data_dir/releases/1-1/exports/open-opportunities.csv" \
            "$data_dir/releases/1-1/exports/open-opportunities.json" \
            "$data_dir/releases/1-1/exports/dataset-metadata.json"
          sudo ln -s releases/1-1 "$data_dir/current"
          printf 'legacy-only\n' | sudo tee "$data_dir/exports/open-opportunities.csv" >/dev/null
          printf 'legacy-only\n' | sudo tee "$data_dir/exports/dataset-metadata.json" >/dev/null
          # The image was built with Compose's localhost default; runtime metadata
          # routes must still advertise the production origin.
          if ! SITE_URL=https://techopportunities.eu OPPORTUNITIES_RELEASE_ROOT=/app/data docker compose up --detach site; then
            docker compose logs site opportunities
            exit 1
          fi

          # Container start does not imply Next.js has begun listening. Wait only for
          # readiness; once ready, run the full smoke test exactly once so a failing
          # assertion is not mistaken for a transient startup failure.
          ready=false
          for _ in $(seq 1 30); do
            if docker compose exec --no-TTY site node -e '
              fetch("http://127.0.0.1:3000/robots.txt", {signal: AbortSignal.timeout(3000)})
                .then(response => process.exit(response.ok ? 0 : 1))
                .catch(() => process.exit(1))
            '; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Site did not become ready within 30 attempts."
            docker compose logs site opportunities
            exit 1
          fi

          if ! docker compose exec --no-TTY site node --input-type=module <<'NODE'
          import {createHash} from "node:crypto";
          import {readFileSync} from "node:fs";
          import {get} from "node:http";

          const baseUrl = "http://127.0.0.1:3000";
          const canonicalOrigin = "https://techopportunities.eu";
          const [page, csv, json, metadata, schema, robots, sitemap] = await Promise.all([
            fetch(baseUrl),
            fetch(`${baseUrl}/open-opportunities.csv`),
            fetch(`${baseUrl}/open-opportunities.json`),
            fetch(`${baseUrl}/dataset-metadata.json`),
            fetch(`${baseUrl}/schemas/opportunities-v1.schema.json`),
            fetch(`${baseUrl}/robots.txt`),
            fetch(`${baseUrl}/sitemap.xml`),
          ]);
          // Node fetch may ignore an overridden Host header. Use HTTP directly to
          // simulate a reverse proxy forwarding the legacy host to the site.
          const legacyHost = "opportunities2027.simonesiega.com";
          function legacyRequest(path) {
            return new Promise((resolve, reject) => {
              const request = get(`${baseUrl}${path}`, {headers: {host: legacyHost}}, response => {
                response.resume();
                response.on("end", () => resolve({status: response.statusCode, location: response.headers.location}));
              });
              request.on("error", reject);
            });
          }
          const [legacyRoot, legacyDownload, legacyFiltered] = await Promise.all([
            legacyRequest("/"),
            legacyRequest("/open-opportunities.csv?source=old"),
            legacyRequest("/?country=Germany&type=internship"),
          ]);
          const csp = page.headers.get("content-security-policy") ?? "";
          const hsts = page.headers.get("strict-transport-security") ?? "";
          const csvDisposition = csv.headers.get("content-disposition") ?? "";
          const jsonDisposition = json.headers.get("content-disposition") ?? "";
          const [pageHtml, csvBytes, jsonBytes, metadataText, schemaBytes, robotsText, sitemapText] = await Promise.all([
            page.text(),
            csv.arrayBuffer(),
            json.arrayBuffer(),
            metadata.text(),
            schema.arrayBuffer(),
            robots.text(),
            sitemap.text(),
          ]);
          const datasetMetadata = metadata.ok ? JSON.parse(metadataText) : null;
          const csvText = Buffer.from(csvBytes).toString("utf8");
          const jsonText = Buffer.from(jsonBytes).toString("utf8");
          const sha256 = bytes => createHash("sha256").update(Buffer.from(bytes)).digest("hex");
          const valid =
            page.ok &&
            csv.ok &&
            json.ok &&
            metadata.ok &&
            schema.ok &&
            schema.headers.get("content-type")?.includes("application/schema+json") &&
            Buffer.from(schemaBytes).equals(readFileSync("/app/schemas/opportunities-v1.schema.json")) &&
            JSON.parse(Buffer.from(schemaBytes).toString("utf8")).$id ===
              `${canonicalOrigin}/schemas/opportunities-v1.schema.json` &&
            robots.ok &&
            sitemap.ok &&
            csp.includes("default-src 'self'") &&
            csp.includes("script-src 'self' 'unsafe-inline' https://cloud.umami.is") &&
            csp.includes("connect-src 'self' https://gateway.umami.is") &&
            hsts.includes("max-age=63072000") &&
            csvDisposition.includes("open-opportunities.csv") &&
            jsonDisposition.includes("open-opportunities.json") &&
            pageHtml.includes(`rel="canonical" href="${canonicalOrigin}"`) &&
            pageHtml.includes(`property="og:url" content="${canonicalOrigin}"`) &&
            pageHtml.includes(`property="og:image" content="${canonicalOrigin}/opengraph-image`) &&
            pageHtml.includes(`"@id":"${canonicalOrigin}/#website"`) &&
            pageHtml.includes(`"@id":"${canonicalOrigin}/#dataset"`) &&
            pageHtml.includes(`${canonicalOrigin}/open-opportunities.csv`) &&
            pageHtml.includes(`${canonicalOrigin}/open-opportunities.json`) &&
            pageHtml.includes(`data-domains="techopportunities.eu"`) &&
            !pageHtml.includes(legacyHost) &&
            !robotsText.includes(legacyHost) &&
            !sitemapText.includes(legacyHost) &&
            legacyRoot.status === 308 &&
            legacyRoot.location === canonicalOrigin &&
            legacyDownload.status === 308 &&
            legacyDownload.location === `${canonicalOrigin}/open-opportunities.csv?source=old` &&
            legacyFiltered.status === 308 &&
            legacyFiltered.location === `${canonicalOrigin}?country=Germany&type=internship` &&
            csvText.startsWith(
              "linkedin_job_id,company,title,location,link,category,industries,employment_type,start_date"
            ) &&
            jsonText.trim() === "[]" &&
            datasetMetadata.schema_version === "v1" &&
            datasetMetadata.total === 0 &&
            datasetMetadata.internship_count === 0 &&
            datasetMetadata.new_grad_count === 0 &&
            datasetMetadata.csv_sha256 === sha256(csvBytes) &&
            datasetMetadata.json_sha256 === sha256(jsonBytes) &&
            !metadataText.includes("legacy-only") &&
            robotsText.includes(`Host: ${canonicalOrigin}`) &&
            robotsText.includes(`Sitemap: ${canonicalOrigin}/sitemap.xml`) &&
            sitemapText.includes(`<loc>${canonicalOrigin}/</loc>`);
          if (!valid) console.error("Production site smoke assertions failed.");
          process.exit(valid ? 0 : 1);
          NODE
          then
            docker compose logs site opportunities
            exit 1
          fi

      - name: Upload production SBOMs and build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-container-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 30

  attest:
    # PR code must never receive the OIDC and attestation permissions used here.
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download production SBOMs and build evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-container-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-artifacts

      - name: Attest production SBOMs and build evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build-artifacts/*
