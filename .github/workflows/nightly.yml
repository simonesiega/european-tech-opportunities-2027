name: Nightly full update

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      skip_availability:
        description: Skip the stored-job availability audit and only scrape listings.
        required: false
        default: false
        type: boolean

concurrency:
  group: opportunity-collection
  cancel-in-progress: false

permissions: {}

jobs:
  # Scheduled runs always audit first; manual runs may select collection only.
  process-state:
    name: Audit, collect, and preserve state
    uses: $/.github/workflows/reusable-process-state.yml
    permissions:
      contents: read
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_BACKUP_SSH_PRIVATE_KEY: ${{ secrets.VPS_BACKUP_SSH_PRIVATE_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    with:
      run_availability: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_availability }}
      run_scrape: true
      crawl_authorized: ${{ vars.LINKEDIN_CRAWL_AUTHORIZED }}
      projection_artifact_name: opportunities-nightly-projections-${{ github.run_id }}
      readme_artifact_name: opportunities-nightly-readme-${{ github.run_id }}
      backup_user: ${{ vars.VPS_BACKUP_USER || 'opportunities-backup' }}
      ssh_port: ${{ vars.VPS_SSH_PORT || '22' }}
      retention_days: ${{ vars.CANONICAL_STATE_RETENTION_DAYS || '365' }}

  # GitHub mutation is isolated from canonical state and VPS credentials.
  update-readme:
    name: Propose reviewed README projection
    needs: process-state
    uses: $/.github/workflows/reusable-readme-pr.yml
    permissions:
      actions: write
      contents: write
      pull-requests: write
    with:
      artifact_name: opportunities-nightly-readme-${{ github.run_id }}
      branch: automated/nightly-full-update
      title: "data: nightly availability and scrape update"
      commit_message: "data: nightly availability and scrape update"
      body: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.skip_availability &&
        'Availability audit skipped by manual request; collection ran without the separate due-job audit.' ||
        'A bounded batch of due listings was checked for 404/410 responses and explicit closure alerts before collection ran.' }}
        Full collections retain automatic merging after configured requirements pass;
        partial collections require manual review and merge.
      collection_outcome: ${{ needs.process-state.outputs.collection_outcome }}
      auto_merge: ${{ needs.process-state.outputs.collection_outcome == 'full' }}
