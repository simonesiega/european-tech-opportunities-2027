name: Reusable canonical-state processing

on:
  workflow_call:
    inputs:
      run_availability:
        description: Run the full-state availability audit before any scrape.
        required: false
        default: false
        type: boolean
      run_scrape:
        description: Run bounded collection after migration.
        required: false
        default: false
        type: boolean
      generate_exports:
        description: Regenerate public exports without changing the README.
        required: false
        default: false
        type: boolean
      adopt_public_review_seal:
        description: Propose the first reviewed public-state seal without mutating durable state.
        required: false
        default: false
        type: boolean
      add_manual_jobs:
        description: Add an operator-supplied batch before regenerating projections.
        required: false
        default: false
        type: boolean
      manual_jobs_json:
        description: JSON array of manually reviewed jobs for a batch add operation.
        required: false
        default: ""
        type: string
      require_crawl_authorization:
        description: Require the source-access interlock before setup.
        required: false
        default: true
        type: boolean
      crawl_authorized:
        description: Value of the repository source-access interlock.
        required: false
        default: "false"
        type: string
      timeout_minutes:
        description: Maximum processing-job duration.
        required: false
        default: 180
        type: number
      projection_artifact_name:
        description: Name of the retained public-projection artifact.
        required: true
        type: string
      readme_artifact_name:
        description: Optional artifact used to hand the README to a mutation job.
        required: false
        default: ""
        type: string
      deploy_to_vps:
        description: Deploy validated state in the same protected job after snapshot verification.
        required: false
        default: false
        type: boolean
      environment_name:
        description: Main-restricted environment used by the processing job.
        required: false
        default: canonical-state
        type: string
      backup_user:
        description: Restricted SFTP snapshot user.
        required: false
        default: opportunities-backup
        type: string
      ssh_port:
        description: VPS SSH port.
        required: false
        default: "22"
        type: string
      retention_days:
        description: Canonical snapshot retention declaration.
        required: false
        default: "365"
        type: string
    secrets:
      VPS_HOST:
        description: VPS hostname or IP address.
        required: false
      VPS_USER:
        description: Restricted deployment SSH user.
        required: false
      VPS_SSH_PRIVATE_KEY:
        description: Deployment SSH private key used for bootstrap and publication.
        required: false
      VPS_BACKUP_SSH_PRIVATE_KEY:
        description: Restricted SFTP snapshot private key.
        required: false
      VPS_SSH_KNOWN_HOSTS:
        description: Verified SSH known-hosts entries.
        required: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # VPS secrets live only in the selected main-only environment; callers never pass them.
    environment: ${{ inputs.environment_name }}
    env:
      OPPORTUNITIES_LINKEDIN_CRAWL_AUTHORIZED: ${{ inputs.crawl_authorized }}
      UV_NO_DEV: "1"
    steps:
      # Defense in depth in addition to the canonical-state environment branch policy.
      - name: Require the default branch for canonical-state access
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "Canonical-state workflows may run only from main."
          exit 1

      - name: Verify LinkedIn crawl authorization
        if: inputs.require_crawl_authorization && inputs.crawl_authorized != 'true'
        shell: bash
        run: |
          echo "Set the repository variable LINKEDIN_CRAWL_AUTHORIZED=true before source access."
          exit 1

      - name: Keep review-seal adoption read-only
        if: inputs.adopt_public_review_seal && (inputs.run_availability || inputs.run_scrape || inputs.add_manual_jobs || inputs.deploy_to_vps || inputs.readme_artifact_name == '')
        shell: bash
        run: |
          echo "Review-seal adoption requires a README handoff and cannot collect, add, audit, or deploy."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python

      - name: Restore verified canonical state
        env:
          VPS_BACKUP_HOST: ${{ secrets.VPS_HOST }}
          VPS_BACKUP_USER: ${{ inputs.backup_user }}
          VPS_BACKUP_PORT: ${{ inputs.ssh_port }}
          VPS_BACKUP_SSH_PRIVATE_KEY: ${{ secrets.VPS_BACKUP_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ inputs.ssh_port }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: bash scripts/restore_canonical_state.sh

      # Migration failure is a stop condition; restored canonical state is never rebuilt.
      - name: Migrate database
        run: uv run opportunities db-upgrade

      - name: Require restored state to match reviewed main
        env:
          ADOPT_PUBLIC_REVIEW_SEAL: ${{ inputs.adopt_public_review_seal }}
        shell: bash
        run: |
          set -euo pipefail
          reviewed_readme="${RUNNER_TEMP}/reviewed-main-README.md"
          cp README.md "$reviewed_readme"
          uv run opportunities render
          if cmp -s "$reviewed_readme" README.md; then
            exit 0
          fi
          if [ "$ADOPT_PUBLIC_REVIEW_SEAL" = "true" ] && \
             ! grep -Fq '<!-- Public directory state v1 sha256:' "$reviewed_readme"; then
            # One-time bootstrap: the only permitted difference is the new generated seal.
            # No source phase or durable publication runs in this mode.
            seal_count=$(grep -Ec '^<!-- Public directory state v1 sha256: [0-9a-f]{64} -->$' README.md || true)
            if [ "$seal_count" -eq 1 ]; then
              legacy_projection="${RUNNER_TEMP}/legacy-projection-README.md"
              sed -E '/^<!-- Public directory state v1 sha256: [0-9a-f]{64} -->$/d' \
                README.md > "$legacy_projection"
              if cmp -s "$reviewed_readme" "$legacy_projection"; then
                echo "Verified the legacy README; proposing its public-state review seal."
                exit 0
              fi
            fi
          fi
          echo "Restored canonical state is ahead of the reviewed README on main."
          echo "Merge or otherwise resolve the matching README state proposal before running another canonical-state workflow."
          exit 1

      - name: Check every stored public job page for closure alerts
        if: inputs.run_availability
        shell: bash
        run: |
          set +e
          uv run opportunities check-availability
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "Partial availability audit: inconclusive responses were preserved."
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Scrape and persist selected searches
        if: inputs.run_scrape
        shell: bash
        run: |
          set +e
          uv run opportunities scrape
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "Partial success: successful searches were persisted; failed searches changed nothing."
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Add manually reviewed jobs
        if: inputs.add_manual_jobs
        env:
          MANUAL_JOBS_JSON: ${{ inputs.manual_jobs_json }}
        shell: bash
        run: |
          set -euo pipefail
          batch_file=$(mktemp "${RUNNER_TEMP}/manual-jobs.XXXXXX")
          trap 'rm -f "$batch_file"' EXIT
          printf '%s' "$MANUAL_JOBS_JSON" > "$batch_file"
          unset MANUAL_JOBS_JSON
          uv run opportunities add-jobs --input "$batch_file" --no-render

      - name: Regenerate projections after manual job additions
        if: inputs.add_manual_jobs
        run: uv run opportunities render

      - name: Generate public exports
        if: inputs.generate_exports
        run: uv run opportunities export-public

      - name: Validate database and generated projections
        run: uv run opportunities validate

      - name: Checkpoint SQLite
        run: >-
          uv run python -c "import sqlite3; db=sqlite3.connect('data/opportunities.db');
          db.execute('PRAGMA wal_checkpoint(TRUNCATE)'); db.close()"

      - name: Configure restricted VPS snapshot access
        if: inputs.adopt_public_review_seal != true
        env:
          VPS_BACKUP_SSH_PRIVATE_KEY: ${{ secrets.VPS_BACKUP_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          if [ -z "$VPS_BACKUP_SSH_PRIVATE_KEY" ] || [ -z "$VPS_SSH_KNOWN_HOSTS" ]; then
            echo "Restricted backup key and verified known_hosts entry are required."
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_BACKUP_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_backup_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_backup_ed25519" "$HOME/.ssh/known_hosts"

      - name: Publish and restore-verify VPS canonical snapshot
        if: inputs.adopt_public_review_seal != true
        id: canonical-snapshot
        env:
          VPS_BACKUP_HOST: ${{ secrets.VPS_HOST }}
          VPS_BACKUP_USER: ${{ inputs.backup_user }}
          VPS_BACKUP_PORT: ${{ inputs.ssh_port }}
          CANONICAL_STATE_RETENTION_DAYS: ${{ inputs.retention_days }}
        shell: bash
        run: bash scripts/canonical_state_store.sh publish

      - name: Remove SSH credentials
        if: always() && inputs.adopt_public_review_seal != true
        shell: bash
        run: rm -f "$HOME/.ssh/id_backup_ed25519" "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Publish versioned database and exports release
        if: inputs.deploy_to_vps
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ inputs.ssh_port }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: bash scripts/deploy_canonical_state.sh

      # GitHub cache and artifacts are readable from pull requests; retain only public projections.
      - name: Stage retained public-projection bundle
        shell: bash
        run: |
          bundle="${RUNNER_TEMP}/public-projection-artifact"
          rm -rf "$bundle"
          mkdir -p "$bundle/exports"
          cp data/exports/open-opportunities.csv "$bundle/exports/open-opportunities.csv"
          cp data/exports/open-opportunities.json "$bundle/exports/open-opportunities.json"
          cp README.md "$bundle/README.md"

      - name: Upload retained public-projection bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.projection_artifact_name }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/public-projection-artifact/

      # Mutation jobs receive only README.md, never the database or VPS credentials.
      - name: Upload README handoff
        if: inputs.readme_artifact_name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.readme_artifact_name }}
          retention-days: 1
          if-no-files-found: error
          path: README.md
