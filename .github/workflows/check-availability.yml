name: Check job availability

on:
  workflow_dispatch:

concurrency:
  group: opportunity-collection
  cancel-in-progress: false

permissions: {}

jobs:
  # This mode audits all stored rows but deliberately skips new discovery.
  process-state:
    name: Audit and preserve state
    uses: $/.github/workflows/reusable-process-state.yml
    permissions:
      contents: read
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_BACKUP_SSH_PRIVATE_KEY: ${{ secrets.VPS_BACKUP_SSH_PRIVATE_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    with:
      run_availability: true
      crawl_authorized: ${{ vars.LINKEDIN_CRAWL_AUTHORIZED }}
      timeout_minutes: 120
      projection_artifact_name: opportunities-availability-projections-${{ github.run_id }}
      readme_artifact_name: opportunities-availability-readme-${{ github.run_id }}
      backup_user: ${{ vars.VPS_BACKUP_USER || 'opportunities-backup' }}
      ssh_port: ${{ vars.VPS_SSH_PORT || '22' }}
      retention_days: ${{ vars.CANONICAL_STATE_RETENTION_DAYS || '365' }}

  # GitHub mutation is isolated from canonical state and VPS credentials.
  update-readme:
    name: Propose reviewed README projection
    needs: process-state
    uses: $/.github/workflows/reusable-readme-pr.yml
    permissions:
      actions: write
      contents: write
      pull-requests: write
    with:
      artifact_name: opportunities-availability-readme-${{ github.run_id }}
      branch: automated/availability-update
      title: "data: remove unavailable positions"
      commit_message: "data: remove unavailable positions"
      body: >-
        Manual full-database availability audit. Explicit 404/410 listings and pages showing
        'No longer accepting applications' were removed; merge remains manual.
