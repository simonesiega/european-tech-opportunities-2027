name: Site CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keep only the newest validation for a ref; required checks apply to the latest SHA.
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Check formatting, lint, types, build, and behavior
        env:
          SITE_URL: https://techopportunities.eu
        run: bun run ci
      - name: Audit built site with Lighthouse CI
        id: lighthouse
        env:
          SITE_URL: https://techopportunities.eu
        run: |
          OPPORTUNITIES_DATABASE_PATH="$(pwd)/tests/e2e/.tmp/opportunities.db" \
          OPPORTUNITIES_PUBLIC_EXPORT_DIR="$(pwd)/tests/e2e/.tmp" \
          CHROME_PATH="$(bun -e 'import {chromium} from "@playwright/test"; console.log(chromium.executablePath())')" \
            bun run lighthouse
      - name: Upload failed Lighthouse reports
        if: ${{ !cancelled() && steps.lighthouse.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: site/.lighthouseci/*.report.*
          if-no-files-found: ignore
          retention-days: 7
