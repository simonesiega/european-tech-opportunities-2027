name: Reusable README pull request

on:
  workflow_call:
    inputs:
      artifact_name:
        description: README handoff artifact produced by canonical-state processing.
        required: true
        type: string
      branch:
        description: Automation branch to update; optionally suffixed with the caller run date.
        required: true
        type: string
      title:
        description: Pull-request title.
        required: true
        type: string
      append_rome_date_to_branch_and_title:
        description: Append the caller run date in Europe/Rome to the branch and pull-request title.
        required: false
        default: false
        type: boolean
      body:
        description: Pull-request body.
        required: true
        type: string
      commit_message:
        description: Commit message.
        required: true
        type: string
      collection_outcome:
        description: Collection outcome from the validated processor; partial always requires manual merge.
        required: false
        default: none
        type: string
      auto_merge:
        description: Merge after validation and scope checks, using GitHub auto-merge when enabled.
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      # Defense in depth: repository mutation is valid only for a main-branch caller.
      - name: Require the default branch for repository mutation
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "README automation may run only from main."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download generated README
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/readme-handoff
      - name: Install generated README
        shell: bash
        run: cp "${{ runner.temp }}/readme-handoff/README.md" README.md
      - name: Open or update scoped README pull request
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: ${{ inputs.branch }}
          UPDATE_TITLE: ${{ inputs.title }}
          UPDATE_APPEND_ROME_DATE: ${{ inputs.append_rome_date_to_branch_and_title }}
          UPDATE_BODY: ${{ inputs.body }}
          UPDATE_COMMIT_MESSAGE: ${{ inputs.commit_message }}
          UPDATE_AUTO_MERGE: ${{ inputs.auto_merge && inputs.collection_outcome != 'partial' }}
          COLLECTION_OUTCOME: ${{ inputs.collection_outcome }}
        shell: bash
        run: |
          set -euo pipefail

          case "$COLLECTION_OUTCOME" in
            full|none) ;;
            partial)
              UPDATE_AUTO_MERGE=false
              UPDATE_BRANCH+="-partial"
              UPDATE_TITLE+=" (partial collection; manual review)"
              UPDATE_BODY+=$'\n\nValidated partial collection, not a complete registry update. Review the aggregate quality report and public projections. Manual review and merge required.'
              ;;
            *) echo "Invalid collection outcome; refusing proposal."; exit 1 ;;
          esac

          if [ "$UPDATE_APPEND_ROME_DATE" = "true" ]; then
            run_created_at=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at')
            run_date=$(TZ=Europe/Rome date -d "$run_created_at" +%F)
            UPDATE_BRANCH="${UPDATE_BRANCH}-${run_date}"
            UPDATE_TITLE="${UPDATE_TITLE} (${run_date})"
          fi

          UPDATE_BODY+=$'\n\nReview the sanitized public CSV/JSON projection in this run\'s artifacts:\n'
          UPDATE_BODY+="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          pr_number=$(gh pr list \
            --head "$UPDATE_BRANCH" \
            --base main \
            --state open \
            --json number,isCrossRepository \
            --jq 'map(select(.isCrossRepository == false)) | .[0].number // empty')
          if [ -n "$pr_number" ]; then
            existing_scope=$(gh pr view "$pr_number" \
              --json baseRefName,headRefName,title,files,isCrossRepository | \
              jq -r --arg branch "$UPDATE_BRANCH" --arg title "$UPDATE_TITLE" \
                '(.baseRefName == "main") and (.headRefName == $branch) and (.isCrossRepository == false) and (.title == $title) and ([.files[].path] == ["README.md"])')
            if [ "$existing_scope" != "true" ]; then
              echo "Existing automation pull request has unexpected scope; refusing to mutate it."
              exit 1
            fi
          fi

          if [ "$COLLECTION_OUTCOME" = "partial" ] && [ -n "$pr_number" ]; then
            # Cancel any previously enabled auto-merge before updating partial state.
            gh pr merge "$pr_number" --disable-auto
          fi

          if git diff --quiet -- README.md; then
            echo "No README changes to propose."
            if [ -n "$pr_number" ]; then
              # Prevent an older automation proposal from merging after state returns to main.
              gh pr close "$pr_number" \
                --comment "Closing the stale automation proposal because canonical state now matches main." \
                --delete-branch
            fi
            exit 0
          fi

          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" || true
          git checkout -B "$UPDATE_BRANCH"
          git add README.md
          git commit -m "$UPDATE_COMMIT_MESSAGE"
          git push --force-with-lease --set-upstream origin "$UPDATE_BRANCH"

          if [ -z "$pr_number" ]; then
            gh pr create \
              --title "$UPDATE_TITLE" \
              --body "$UPDATE_BODY" \
              --base main \
              --head "$UPDATE_BRANCH"
            pr_number=$(gh pr list \
              --head "$UPDATE_BRANCH" \
              --base main \
              --state open \
              --json number,isCrossRepository \
              --jq 'map(select(.isCrossRepository == false)) | .[0].number // empty')
          fi
          if [ -z "$pr_number" ]; then
            echo "Could not identify the README pull request."
            exit 1
          fi

          # GITHUB_TOKEN-created PR workflows can require approval. Dispatch the complete
          # validation suite explicitly so unattended checks attach to this head SHA.
          head_sha=$(git rev-parse HEAD)
          safe_scope=false
          for attempt in 1 2 3 4 5; do
            safe_scope=$(gh pr view "$pr_number" \
              --json baseRefName,headRefName,headRefOid,title,files,isCrossRepository | \
              jq -r --arg branch "$UPDATE_BRANCH" --arg title "$UPDATE_TITLE" --arg sha "$head_sha" \
                '(.baseRefName == "main") and (.headRefName == $branch) and (.headRefOid == $sha) and (.isCrossRepository == false) and (.title == $title) and ([.files[].path] == ["README.md"])')
            if [ "$safe_scope" = "true" ]; then
              break
            fi
            sleep "$((attempt * 2))"
          done
          if [ "$safe_scope" != "true" ]; then
            echo "README pull request failed the exact-scope safety check."
            exit 1
          fi

          validation_workflows=(python-ci.yml site-ci.yml docker-ci.yml codeql.yml gitleaks.yml documentation.yml dependency-review.yml)
          validation_started_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          for validation_workflow in "${validation_workflows[@]}"; do
            dispatch_args=(--ref "$UPDATE_BRANCH")
            if [ "$validation_workflow" = "dependency-review.yml" ]; then
              dispatch_args+=(--raw-field "pull_request_number=$pr_number")
            fi
            gh workflow run "$validation_workflow" "${dispatch_args[@]}"
          done

          # Await dispatched runs before auto-merge can delete their branch, even without
          # branch protection; otherwise GitHub may fail to create their jobs.
          validation_run_ids=()
          for validation_workflow in "${validation_workflows[@]}"; do
            run_id=""
            for attempt in $(seq 1 30); do
              run_id=$(gh run list \
                --workflow "$validation_workflow" \
                --branch "$UPDATE_BRANCH" \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,createdAt,headSha \
                --jq "map(select(.headSha == \"$head_sha\" and .createdAt >= \"$validation_started_at\")) | sort_by(.createdAt) | last | .databaseId // empty")
              if [ -n "$run_id" ]; then
                break
              fi
              sleep "$((attempt * 2))"
            done
            if [ -z "$run_id" ]; then
              echo "Could not identify the $validation_workflow validation run for $head_sha."
              exit 1
            fi
            validation_run_ids+=("$run_id")
          done

          for index in "${!validation_workflows[@]}"; do
            echo "Waiting for ${validation_workflows[$index]} run ${validation_run_ids[$index]}."
            gh run watch "${validation_run_ids[$index]}" --compact --exit-status
          done

          if [ "$UPDATE_AUTO_MERGE" = "true" ]; then
            # Validation can take an hour. Recheck mutable PR metadata after waiting,
            # not only before dispatch; the merge API separately pins the head SHA.
            safe_scope=$(gh pr view "$pr_number" \
              --json baseRefName,headRefName,headRefOid,title,files,isCrossRepository | \
              jq -r --arg branch "$UPDATE_BRANCH" --arg title "$UPDATE_TITLE" --arg sha "$head_sha" \
                '(.baseRefName == "main") and (.headRefName == $branch) and (.headRefOid == $sha) and (.isCrossRepository == false) and (.title == $title) and ([.files[].path] == ["README.md"])')
            if [ "$safe_scope" != "true" ]; then
              echo "README pull request scope changed during validation; refusing auto-merge."
              exit 1
            fi
            merge_args=(--squash --match-head-commit "$head_sha")
            # The repository's optional auto-merge feature is not required for a
            # fully validated PR. Both modes still obey GitHub's merge protections.
            allow_auto_merge=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.allow_auto_merge')
            case "$allow_auto_merge" in
              true) merge_args+=(--auto) ;;
              false) echo "Repository auto-merge is disabled; requesting a normal squash merge." ;;
              *) echo "Could not determine repository auto-merge policy."; exit 1 ;;
            esac
            gh pr merge "$pr_number" "${merge_args[@]}"
          fi
