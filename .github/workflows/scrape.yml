name: Scrape jobs or deploy reviewed state

on:
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        description: "Deploy reviewed durable state from main (skips collection)"
        required: false
        default: false
        type: boolean

concurrency:
  group: opportunity-collection
  cancel-in-progress: false

permissions: {}

jobs:
  # Collection and deployment are mutually exclusive modes of this manual entry point.
  collect:
    name: Collect and preserve state
    if: inputs.deploy_to_vps != true
    uses: ./.github/workflows/reusable-process-state.yml
    permissions:
      contents: read
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_BACKUP_SSH_PRIVATE_KEY: ${{ secrets.VPS_BACKUP_SSH_PRIVATE_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    with:
      run_scrape: true
      crawl_authorized: ${{ vars.LINKEDIN_CRAWL_AUTHORIZED }}
      projection_artifact_name: opportunities-scrape-projections-${{ github.run_id }}
      readme_artifact_name: opportunities-scrape-readme-${{ github.run_id }}
      backup_user: ${{ vars.VPS_BACKUP_USER || 'opportunities-backup' }}
      ssh_port: ${{ vars.VPS_SSH_PORT || '22' }}
      retention_days: ${{ vars.CANONICAL_STATE_RETENTION_DAYS || '365' }}

  # Deployment performs no source access and remains inside the protected production job.
  deploy:
    name: Validate, preserve, and deploy reviewed state
    if: inputs.deploy_to_vps
    uses: ./.github/workflows/reusable-process-state.yml
    permissions:
      contents: read
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_BACKUP_SSH_PRIVATE_KEY: ${{ secrets.VPS_BACKUP_SSH_PRIVATE_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    with:
      generate_exports: true
      require_crawl_authorization: false
      deploy_to_vps: true
      environment_name: production
      projection_artifact_name: opportunities-deployment-projections-${{ github.run_id }}
      backup_user: ${{ vars.VPS_BACKUP_USER || 'opportunities-backup' }}
      ssh_port: ${{ vars.VPS_SSH_PORT || '22' }}
      retention_days: ${{ vars.CANONICAL_STATE_RETENTION_DAYS || '365' }}

  # GitHub mutation is isolated from canonical state and VPS credentials.
  update-readme:
    name: Propose reviewed README projection
    if: inputs.deploy_to_vps != true
    needs: collect
    uses: ./.github/workflows/reusable-readme-pr.yml
    permissions:
      actions: write
      contents: write
      pull-requests: write
    with:
      artifact_name: opportunities-scrape-readme-${{ github.run_id }}
      branch: automated/scrape-update
      title: "data: scrape position updates"
      commit_message: "data: update position tables"
      body: "Manual scrape-only update. Merge remains manual."
