name: Add manually reviewed jobs

on:
  workflow_dispatch:
    inputs:
      jobs_json:
        description: "JSON array of 1-10 reviewed jobs; see the automation guide for fields and an example"
        required: true
        type: string

concurrency:
  group: opportunity-collection
  cancel-in-progress: false

permissions: {}

jobs:
  process-state:
    name: Add reviewed jobs and preserve state
    uses: ./.github/workflows/reusable-process-state.yml
    permissions:
      contents: read
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_BACKUP_SSH_PRIVATE_KEY: ${{ secrets.VPS_BACKUP_SSH_PRIVATE_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    with:
      add_manual_jobs: true
      manual_jobs_json: ${{ inputs.jobs_json }}
      require_crawl_authorization: false
      timeout_minutes: 30
      projection_artifact_name: opportunities-manual-jobs-projections-${{ github.run_id }}
      readme_artifact_name: opportunities-manual-jobs-readme-${{ github.run_id }}
      backup_user: ${{ vars.VPS_BACKUP_USER || 'opportunities-backup' }}
      ssh_port: ${{ vars.VPS_SSH_PORT || '22' }}
      retention_days: ${{ vars.CANONICAL_STATE_RETENTION_DAYS || '365' }}

  update-readme:
    name: Propose manually reviewed README projection
    needs: process-state
    uses: ./.github/workflows/reusable-readme-pr.yml
    permissions:
      actions: write
      contents: write
      pull-requests: write
    with:
      artifact_name: opportunities-manual-jobs-readme-${{ github.run_id }}
      branch: automated/manual-jobs
      title: "data: add manually reviewed jobs"
      append_rome_date_to_branch_and_title: true
      commit_message: "data: add manually reviewed jobs"
      body: >-
        Manually reviewed jobs added to durable canonical state. This pull request changes
        only the generated README projection and remains subject to manual review.
