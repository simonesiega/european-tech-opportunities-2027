site_name: European Tech Opportunities — Docs
site_url: https://docs.techopportunities.eu/
site_description: User guides for finding roles and using open data, with a separate maintainer handbook
repo_url: https://github.com/simonesiega/european-tech-opportunities-2027
repo_name: simonesiega/european-tech-opportunities-2027
edit_uri: edit/main/
docs_dir: !ENV DOCS_BUILD_DIR
site_dir: build/docs-site
# Keep repository-relative assets portable between GitHub and the staged site.
use_directory_urls: false
strict: true
nav:
  - Documentation home: docs/README.md
  - Using the product:
      - Start here: docs/users/README.md
      - Browsing:
          - Find and share roles: docs/users/browsing/directory.md
          - Saved, applied, hidden, and new: docs/users/browsing/lists.md
          - Questions and troubleshooting: docs/users/browsing/help.md
      - Data:
          - Get the dataset: docs/users/data/data.md
          - Use the public API: docs/users/data/api.md
  - Maintaining the project:
      - Handbook: docs/maintainers/README.md
      - Coding-agent guidelines: AGENTS.md
      - Getting started:
          - Local setup: docs/maintainers/getting-started/setup.md
          - Configuration reference: docs/maintainers/getting-started/configuration.md
      - Engineering:
          - Architecture and invariants: docs/maintainers/engineering/architecture.md
          - Classification evidence: docs/maintainers/engineering/classification.md
          - Search registry: docs/maintainers/engineering/search-registry.md
          - Website engineering: docs/maintainers/engineering/website.md
          - Testing strategy: docs/maintainers/engineering/testing.md
          - Documentation maintenance: docs/maintainers/engineering/documentation.md
          - Promotional video: docs/assets/promo/maintainers/VIDEO.md
      - Operations:
          - CLI reference: docs/maintainers/operations/cli.md
          - Automation and operations: docs/maintainers/operations/automation.md
          - Database and lifecycle: docs/maintainers/operations/database.md
          - Containers and deployment: docs/maintainers/operations/deployment.md
          - Operator troubleshooting: docs/maintainers/operations/troubleshooting.md
  - Maps and repository references:
      - Repository maps: docs/assets/diagram/README.md
      - Diagram source: docs/assets/diagram/source.md
      - Visual assets: docs/assets/README.md
      - Workflow inventory: https://github.com/simonesiega/european-tech-opportunities-2027/blob/main/.github/WORKFLOWS.md
      - Script inventory: https://github.com/simonesiega/european-tech-opportunities-2027/blob/main/scripts/SCRIPT.md
  - Project and policies:
      - Product showcase: README.md
      - Contributing: CONTRIBUTING.md
      - Security: SECURITY.md
      - Privacy: PRIVACY.md
      - Code of Conduct: CODE_OF_CONDUCT.md
      - License: LICENSE
theme:
  name: material
  favicon: docs/assets/site-icon.svg
  font: false
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables
plugins:
  - search
