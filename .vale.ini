StylesPath = .github/vale/styles
MinAlertLevel = error

[*.md]
# Built-in spelling/grammar/repetition rules misidentify job titles, company
# names, and domain terms. Markdownlint handles structure and heading punctuation.
BasedOnStyles = Project
# README regions and the maintainer coverage table are renderer-owned.
# Authored prose remains in scope.
BlockIgnores = (?s)(<!-- BEGIN [A-Z ]+ -->.*?<!-- END [A-Z ]+ -->)
